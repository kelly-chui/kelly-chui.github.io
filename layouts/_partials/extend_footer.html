{{- $features := .Param "features" -}}
{{- if and .IsPage (in $features "katex") }}
<script src="{{ "js/vendor/katex.min.js" | relURL }}"></script>
<script src="{{ "js/vendor/auto-render.min.js" | relURL }}"></script>
<script src="{{ "js/katex-init.js" | relURL }}"></script>
{{- end }}
{{- if .IsPage }}
<script src="{{ "js/post-toc.js" | relURL }}"></script>
{{- end }}
{{- if and .IsPage (in $features "mermaid") (.Store.Get "hasMermaid") }}
<script src="{{ "js/vendor/mermaid.min.js" | relURL }}"></script>
<script src="{{ "js/mermaid-github.js" | relURL }}"></script>
{{- end }}
{{- if and .IsPage (in $features "jsxgraph") (.Store.Get "hasJSXGraph") }}
<script src="{{ "js/vendor/jsxgraphcore.js" | relURL }}"></script>
<script src="{{ "js/jsxgraph-init.js" | relURL }}"></script>
{{- end }}
